# Publishes store/04_confidentialite (privacy policies, help pages) to GitHub Pages:
#   https://raphzaf.github.io/KeepLid/privacy-fr.html, privacy-en.html, aide.html, help.html
# One-time setup: repository Settings › Pages › Source: "GitHub Actions".
# (GitHub Pages on a private repository requires a paid GitHub plan; otherwise host these static files elsewhere.)
name: pages

on:
  push:
    branches: [main]
    paths: ['store/04_confidentialite/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: store/04_confidentialite
      - id: deployment
        uses: actions/deploy-pages@v4
