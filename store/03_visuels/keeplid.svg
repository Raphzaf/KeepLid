<?xml version="1.0" encoding="UTF-8"?>
<!-- KeepLid master icon (256x256). generate_icons.py derives every PNG/ICO from this file:
     it toggles / recolours the elements below by id. Do not rename the ids. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3A8A"/>
      <stop offset="1" stop-color="#2F7CF6"/>
    </linearGradient>
  </defs>
  <!-- Tile background (hidden for tray icons and unplated assets) -->
  <rect id="background" x="0" y="0" width="256" height="256" rx="56" fill="url(#bg-gradient)"/>
  <g id="laptop">
    <!-- Screen (lid) -->
    <rect id="screen" x="46" y="54" width="164" height="112" rx="14" fill="#FFFFFF"/>
    <rect id="screen-inner" x="60" y="68" width="136" height="84" rx="6" fill="#1D3A8A"/>
    <!-- Base -->
    <path id="base" d="M22 178 H234 L222 202 H34 Z" fill="#FFFFFF"/>
  </g>
  <!-- "Awake" spark (AI keeps working) -->
  <path id="spark" fill="#FFD84D"
        d="M128 76 C131 98 136 103 158 110 C136 117 131 122 128 144 C125 122 120 117 98 110 C120 103 125 98 128 76 Z"/>
  <!-- Guard-rail exclamation mark (hidden by default) -->
  <g id="exclamation" display="none" fill="#FFFFFF">
    <rect x="119" y="74" width="18" height="46" rx="9"/>
    <circle cx="128" cy="136" r="10"/>
  </g>
  <!-- Lid-mode badge (hidden by default) -->
  <g id="badge-lid" display="none">
    <circle cx="204" cy="198" r="46" fill="#16A34A" stroke="#FFFFFF" stroke-width="10"/>
    <path d="M182 198 L198 214 L228 182" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
